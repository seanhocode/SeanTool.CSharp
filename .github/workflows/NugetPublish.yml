# secrets.GITHUB_TOKEN 在 push 和 release 時都需要相應權限，需確認 Repo 的 Settings > Actions > General > Workflow permissions 是 Read and write

name: NuGet Publish

on:
  push:
    branches:
      - Dev/Shell
  workflow_dispatch:

jobs:
  publish:
    # ubuntu-latest 是 GitHub Actions 最輕量、啟動最快、執行速度也最快的 Runner
    # .NET 在 Linux 上編譯、Restore、Pack 的效能都比 Windows 佳
    # 並且所有 dotnet CLI 指令（restore/build/pack/push）在 Ubuntu 上完全可用
    # 因此非常適合用來做 NuGet 套件的自動化編譯與發布
    # 因加入Form專案，改用 Windows Runner
    runs-on: windows-latest

    # 設定全域預設 shell 為 pwsh，所有步驟邏輯集中於 Shell/CICD.ps1
    defaults:
      run:
        shell: pwsh

    steps:
      # 檢出原始碼
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 要完整 diff
          submodules: true

      # 讀取同資料夾下的設定檔
      - name: Load environment variables
        run: ./Shell/CICD.ps1 -Command ImportEnvFile -EnvFile .github/workflows/public.env

      # 安裝 .NET SDK，用於 restore/build/publish
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
#           11.0.x

      # ---------------------------------------------------------
      # Step.1 取得本次 commit 的變動檔案
      # ---------------------------------------------------------
      - name: Get changed files
        id: diff
        run: ./Shell/CICD.ps1 -Command GetChangedFiles -Before "${{ github.event.before }}" -After "${{ github.event.after }}"

      # ---------------------------------------------------------
      # Step.2 找出哪些 Tool 有變動（csproj / cs / 其他檔都算）
      # ---------------------------------------------------------
      - name: Detect Changed Projects
        id: detect
        run: ./Shell/CICD.ps1 -Command GetChangedProjects -IncludeProjects "$env:INCLUDE_PROJECTS"

      - name: Skip if no tool changed
        # steps.detect.outputs.changed_projects => 指向前一個步驟（id: detect）產生的輸出結果
        if: ${{ steps.detect.outputs.changed_projects == '' }}
        run: |
          Write-Host "🚫 No Tool project changed. Skip."
          exit 0

      # ---------------------------------------------------------
      # Step.3 Clean, restore, build and pack
      # ---------------------------------------------------------
      - name: Pack Changed Projects
        if: ${{ steps.detect.outputs.changed_projects != '' }}
        run: ./Shell/CICD.ps1 -Command PackProjects -ChangedProjects "${{ steps.detect.outputs.changed_projects }}" -OutputDir ./nupkg

# secrets.GITHUB_TOKEN 是 GitHub Actions 自動提供的授權
# 可以用來將 NuGet 套件發布到同一個 Repo的 GitHub Packages
# 但若要跨 Repo 推送或讀取私有套件，則必須使用 PAT
      - name: Publish to GitHub Packages
        run: ./Shell/CICD.ps1 -Command PublishPackages -GitHubToken "${{ secrets.GITHUB_TOKEN }}" -NugetSource "$env:GITHUB_NUGET_SOURCE" -OutputDir ./nupkg
